<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Logs - Admin Panel - Kavron Labs</title>
<meta name="description" content="Admin Logs - Admin Panel on Kavron Labs.">
<link rel="stylesheet" href="../shared/css/global.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="../cookies/cookie-consent.css">
</head>
<body>
<header class="site" data-root="../"></header>
<main>
<h1>Admin Logs</h1>
<p class="small">Every ADD, REMOVE, new-tool and settings action in this browser is recorded here, with its date and time.</p>
<button type="button" id="clearLogsBtn" class="danger">Clear log</button>
<div class="toolbox"><table><thead><tr><th>Date</th><th>Action</th><th>Detail</th></tr></thead><tbody id="logRows"></tbody></table></div>

</main>
<footer class="site" data-root="../"></footer>
<script src="../shared/js/common.js"></script>
<script src="../shared/js/tool-registry.js"></script>
<script src="../cookies/cookie-consent.js"></script>
<script src="js/admin.js"></script>
<script>
function renderLogs(){
  var log = [];
  try{ log = JSON.parse(localStorage.getItem('kavronlabs_admin_log')||'[]'); }catch(e){}
  document.getElementById('logRows').innerHTML = log.length ? log.map(function(x){
    return '<tr><td>'+new Date(x.date).toLocaleString()+'</td><td>'+x.action+'</td><td>'+x.detail+'</td></tr>';
  }).join('') : '<tr><td colspan="3">No admin actions yet.</td></tr>';
}
document.getElementById('clearLogsBtn').addEventListener('click', function(){
  try{ localStorage.removeItem('kavronlabs_admin_log'); }catch(e){}
  renderLogs();
});
renderLogs();
</script>
</body>
</html>
