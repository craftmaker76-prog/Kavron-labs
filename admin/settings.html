<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings - Admin Panel - Kavron Labs</title>
<meta name="description" content="Settings - Admin Panel on Kavron Labs.">
<link rel="stylesheet" href="../shared/css/global.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="../cookies/cookie-consent.css">

<body>
<header class="site" data-root="../"></header>
<main>
<h1>Settings</h1>
<p class="small">Settings are saved in this browser only. They do not change files in VS Code.</p>
<form id="settingsForm" class="toolbox">
<label>Site name <input name="siteName" value="Kavron Labs"></label>
<label>Tagline <input name="tagline" value="Powerful Tools. One Simple Platform."></label>
<button type="submit">Save settings</button>
<p id="settingsMsg" class="small"></p>
</form>

</main>
<footer class="site" data-root="../"></footer>
<script src="../shared/js/common.js"></script>
<script src="../shared/js/tool-registry.js"></script>
<script src="../cookies/cookie-consent.js"></script>
<script src="js/admin.js"></script><script src="js/settings.js"></script>
</body>
</html>
